document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a49b132a-4fb1-4371-a759-e495a90b72a2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"aa9e65bc-04c8-4938-94fd-b35010f5c78e\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{margin:0;background:#08080A;font-family:'Manrope',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:var(--acc);text-decoration:none}\n  a:hover{color:var(--txt)}\n  input,select,button{font-family:inherit}\n  [data-theme=\"dark\"]{\n    --bg:#08080A; --card:#141519; --card2:#1C1E24; --line:rgba(255,255,255,0.07);\n    --txt:#F4F5F7; --mut:#8B9099; --dim:#5D626B;\n    --acc:oklch(0.80 0.14 165); --accSoft:oklch(0.80 0.14 165 / 0.14);\n    --neg:oklch(0.66 0.19 22); --negSoft:oklch(0.66 0.19 22 / 0.15);\n    --n1:#E8B93C; --n2:#E38A2E; --n3:#4A8FD1; --n4:#D2483A; --shadow:0 1px 2px rgba(0,0,0,0.5);\n  }\n  [data-theme=\"light\"]{\n    --bg:#F6F6F7; --card:#FFFFFF; --card2:#F1F2F4; --line:rgba(0,0,0,0.08);\n    --txt:#0D0E11; --mut:#6C717A; --dim:#9AA0A8;\n    --acc:oklch(0.60 0.14 165); --accSoft:oklch(0.60 0.14 165 / 0.12);\n    --neg:oklch(0.56 0.19 22); --negSoft:oklch(0.56 0.19 22 / 0.12);\n    --n1:#C79418; --n2:#C06E14; --n3:#2F6DAF; --n4:#B33325; --shadow:0 1px 3px rgba(0,0,0,0.07);\n  }\n  @keyframes rip{from{transform:scale(0);opacity:.5}to{transform:scale(2.6);opacity:0}}\n  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n  @keyframes flash{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes tickUp{0%{transform:translateY(4px);opacity:.4}100%{transform:none;opacity:1}}\n  @keyframes tickDown{0%{transform:translateY(-4px);opacity:.4}100%{transform:none;opacity:1}}\n  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}\n  @keyframes ringIn{from{opacity:0;transform:rotate(-14deg) scale(.9)}to{opacity:1;transform:none}}\n  @keyframes settle{0%{box-shadow:0 0 0 0 var(--accSoft)}30%{box-shadow:0 0 0 6px var(--accSoft)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}\n  [data-flash=\"1\"]{animation:flash .7s ease}\n  [data-spin=\"1\"]{animation:spin .9s linear infinite}\n  [data-moved=\"1\"]{animation:settle 1.3s ease both}\n  [data-tick=\"up\"]{animation:tickUp .55s cubic-bezier(.2,.8,.2,1) both}\n  [data-tick=\"down\"]{animation:tickDown .55s cubic-bezier(.2,.8,.2,1) both}\n  [data-reveal]{opacity:0;transform:translateY(12px)}\n  [data-reveal][data-in]{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}\n  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}[data-reveal]{opacity:1;transform:none}}\n  .rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:rip .6s ease-out forwards}\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--bg);color:var(--txt);padding:0 0 80px;transition:background .35s ease,color .35s ease\">\n\n  <div style=\"position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <div style=\"width:34px;height:34px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--bg)\">D<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px\">\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:-0.01em\">Monitor DCA<\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:500;color:var(--dim)\">{{ updatedLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <button data-ripple=\"1\" sc-camel-on-click=\"{{ refresh }}\" style=\"position:relative;overflow:hidden;display:flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .2s ease\" style-hover=\"background:var(--card2)\" style-active=\"transform:scale(0.94)\">\n          <span data-spin=\"{{ loadingFlag }}\" style=\"display:inline-block;width:15px;height:15px;border-radius:50%;background:conic-gradient(var(--acc) {{ refreshPct }}%, var(--line) 0);position:relative\">\n            <span style=\"position:absolute;inset:3.5px;border-radius:50%;background:var(--card)\"><\u002Fspan>\n          <\u002Fspan>\n          Precios\n        <\u002Fbutton>\n        <button data-ripple=\"1\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"position:relative;overflow:hidden;width:38px;height:38px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--txt);font-size:14px;cursor:pointer;transition:transform .12s ease\" style-active=\"transform:scale(0.9)\">{{ themeIcon }}<\u002Fbutton>\n        <button data-ripple=\"1\" sc-camel-on-click=\"{{ openSync }}\" title=\"{{ syncTitle }}\" style=\"position:relative;overflow:hidden;width:38px;height:38px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:{{ syncColor }};font-size:14px;cursor:pointer;transition:transform .12s ease,color .2s ease\" style-active=\"transform:scale(0.9)\" style-hover=\"color:var(--txt)\">{{ syncIcon }}<\u002Fbutton>\n        <button data-ripple=\"1\" sc-camel-on-click=\"{{ openSettings }}\" title=\"Ajustes y copias\" style=\"position:relative;overflow:hidden;width:38px;height:38px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--mut);font-size:14px;cursor:pointer;transition:transform .12s ease,color .2s ease\" style-active=\"transform:scale(0.9)\" style-hover=\"color:var(--txt)\">⚙<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1080px;margin:0 auto;padding:28px 24px 0;display:flex;flex-direction:column;gap:14px\">\n\n    <div style=\"background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 28px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim)\">Valor de la cartera<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n          <div style=\"font-size:clamp(38px,6vw,60px);font-weight:800;letter-spacing:-0.03em;line-height:1\">{{ totalValueStr }}<\u002Fdiv>\n          <div style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:{{ pnlBg }};color:{{ pnlColor }};font-size:14px;font-weight:700\">{{ pnlStr }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasUnpriced }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;font-weight:600;color:var(--n1)\">{{ unpricedNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-wrap:wrap;gap :14px;font-weight:600;outline:none\" style-focus=\"border-color:var(--acc)\">\n              <\u002Flabel>\n              <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n                <button data-ripple=\"1\" sc-camel-on-click=\"{{ testGithubConnection }}\" style=\"position:relative;overflow:hidden;height:44px;padding:0 20px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--txt);font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s ease,border-color .2s ease\" style-active=\"transform:scale(0.95)\" style-hover=\"border-color:var(--acc)\">Probar conexión<\u002Fbutton>\n                <div style=\"font-size:12px;font-weight:600;color:{{ syncTestColor }}\">{{ syncTestStatus }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:500;color:var(--dim);text-wrap:pretty\">El token se guarda solo en este navegador (localStorage) y nunca se sube a ningún repo. Créalo en GitHub → Settings → Developer settings → Fine-grained tokens, con acceso limitado solo a este repo de datos y permiso \"Contents: Read and write\".<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ ghConfigured }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;font-weight:600;color:{{ ghStatusColor }}\">{{ ghStatus }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSellModal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"padding:7px 14px;border-radius:100px;background:var(--card2);color:var(--acc);font-size:12px;font-weight:800;letter-spacing:0.04em\">{{ sellTicker }}<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:500;color:var(--dim)\">{{ sellHolding }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)\">Precio de venta<\u002Fspan>\n\n                <input data-key=\"sellPrice\" value=\"{{ sellPriceValue }}\" sc-camel-on-input=\"{{ onField }}\" placeholder=\"precio $\" style=\"height:44px;padding:0 15px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;outline:none\" style-focus=\"border-color:var(--acc)\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)\">Unidades que vendes<\u002Fspan>\n                <input data-key=\"sellUnits\" value=\"{{ sellUnitsValue }}\" sc-camel-on-input=\"{{ onField }}\" placeholder=\"unidades\" style=\"height:44px;padding:0 15px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;outline:none\" style-focus=\"border-color:var(--acc)\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;background:var(--card2);border-radius:18px;padding:15px 17px\">\n              <sc-for list=\"{{ sellSummary }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <div style=\"font-size:17px;font-weight:800;letter-spacing:-0.01em;color:{{ s.color }}\">{{ s.value }}<\u002Fdiv>\n                  <div style=\"font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--dim)\">{{ s.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPosModal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:12px;padding:0 4px\">\n              <div><\u002Fdiv>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)\">Precio de compra<\u002Fdiv>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)\">Unidades<\u002Fdiv>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)\">Capital<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ posFields }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:12px;align-items:center\">\n                <div style=\"font-size:11px;font-weight:800;color:{{ l.color }}\">{{ l.tag }}<\u002Fdiv>\n                <input data-key=\"{{ l.priceKey }}\" value=\"{{ l.priceValue }}\" sc-camel-on-input=\"{{ onField }}\" placeholder=\"precio $\" style=\"height:42px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;outline:none\">\n                <input data-key=\"{{ l.uniKey }}\" value=\"{{ l.uniValue }}\" sc-camel-on-input=\"{{ onField }}\" placeholder=\"unidades\" style=\"height:42px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;outline:none\">\n                <input data-key=\"{{ l.capKey }}\" value=\"{{ l.capValue }}\" sc-camel-on-input=\"{{ onField }}\" placeholder=\"capital $\" style=\"height:42px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;outline:none\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size:12px;font-weight:500;color:var(--dim);padding:0 4px;text-wrap:pretty\">Rellena dos de los tres campos y el tercero se calcula solo: precio × unidades = capital.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--card2);border-radius:18px;padding:14px 16px;margin-top:4px\">\n              <sc-for list=\"{{ posSummary }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <div style=\"font-size:16px;font-weight:800;letter-spacing:-0.01em;color:{{ s.color }}\">{{ s.value }}<\u002Fdiv>\n                  <div style=\"font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--dim)\">{{ s.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:4px\">\n          <sc-if value=\"{{ canDelete }}\" hint-placeholder-val=\"{{ false }}\">\n            <button data-ripple=\"1\" sc-camel-on-click=\"{{ onDelete }}\" style=\"position:relative;overflow:hidden;margin-right:auto;height:44px;padding:0 20px;border:1px solid var(--negSoft);border-radius:100px;background:transparent;color:var(--neg);font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s ease\" style-active=\"transform:scale(0.95)\">Eliminar<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ canRestoreDefault }}\" hint-placeholder-val=\"{{ false }}\">\n            <button data-ripple=\"1\" sc-camel-on-click=\"{{ restoreDefaultAsset }}\" title=\"Sobrescribe los niveles del formulario con los valores de fábrica actuales (por si tu navegador guardó una copia antigua)\" style=\"position:relative;overflow:hidden;height:44px;padding:0 20px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s ease,color .2s ease\" style-active=\"transform:scale(0.95)\" style-hover=\"color:var(--txt)\">↺ Restaurar de fábrica<\u002Fbutton>\n          <\u002Fsc-if>\n          <button data-ripple=\"1\" sc-camel-on-click=\"{{ closeModal }}\" style=\"position:relative;overflow:hidden;height:44px;padding:0 20px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s ease\" style-active=\"transform:scale(0.95)\">Cancelar<\u002Fbutton>\n          <button data-ripple=\"1\" sc-camel-on-click=\"{{ onSave }}\" style=\"position:relative;overflow:hidden;height:44px;padding:0 26px;border:none;border-radius:100px;background:{{ saveBg }};color:var(--bg);font-size:13px;font-weight:800;cursor:pointer;transition:transform .12s ease,background .3s ease\" style-active=\"transform:scale(0.95)\">{{ saveLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:var(--neg);min-height:16px\">{{ modalError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900}}\">\nconst KEY_A = \"monitor_estrategico_assets_v1\";\nconst KEY_P = \"monitor_estrategico_positions_v1\";\nconst KEY_T = \"monitor_dca_theme\";\nconst KEY_H = \"monitor_estrategico_trades_v1\";\nconst KEY_G_OWNER = \"monitor_dca_gh_owner\";\nconst KEY_G_REPO = \"monitor_dca_gh_repo\";\nconst KEY_G_TOKEN = \"monitor_dca_gh_token\";\nconst GH_PATH = \"data.json\";\nconst LVL_COLOR = { 1: \"var(--n1)\", 2: \"var(--n2)\", 3: \"var(--n3)\", 4: \"var(--n4)\" };\n\nfunction b64EncodeUtf8(str) {\n  const bytes = new TextEncoder().encode(str);\n  let bin = \"\";\n  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));\n  return btoa(bin);\n}\nfunction b64DecodeUtf8(b64) {\n  const bin = atob(String(b64 || \"\").replace(/\\n/g, \"\"));\n  const bytes = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n  return new TextDecoder().decode(bytes);\n}\n\nclass Component extends DCLogic {\n  state = {\n    lib: null, assets: [], positions: [], theme: \"dark\", loading: false, updated: null,\n    view: \"monitor\", filter: \"all\", typeFilter: \"all\", search: \"\", expanded: {}, flash: {},\n    anim: { total: 0, invested: 0, pnl: 0 }, chartIn: false,\n    modal: null, form: {}, editingTicker: null, editingPosId: null, calcStatus: \"\", modalError: \"\",\n    ghOwner: \"\", ghRepo: \"\", ghToken: \"\", ghConfigured: false, ghLoadOk: false, ghSha: null, ghStatus: \"\",\n    syncTestStatus: \"\", syncTestOk: false\n  };\n\n  async componentDidMount() {\n    let lib = window.DCALib;\n    for (let i = 0; !lib && i < 60; i++) {\n      await new Promise(r => setTimeout(r, 50));\n      lib = window.DCALib;\n    }\n    if (!lib) { try { lib = await import(\"./dca-assets.js\"); } catch (e) { return; } }\n    let assets = lib.DEFAULT_ASSETS.map(a => ({ ...a }));\n    let positions = [];\n    try {\n      const rawA = localStorage.getItem(KEY_A);\n      if (rawA) { const p = JSON.parse(rawA); if (Array.isArray(p) && p.length) assets = p; }\n      const rawP = localStorage.getItem(KEY_P);\n      if (rawP) { const p = JSON.parse(rawP); if (Array.isArray(p)) positions = p; }\n      const rawH = localStorage.getItem(KEY_H);\n      if (rawH) { const h = JSON.parse(rawH); if (Array.isArray(h)) this.setState({ trades: h }); }\n    } catch (e) {}\n    const theme = localStorage.getItem(KEY_T) || \"dark\";\n    const finnhubKey = localStorage.getItem(\"monitor_estrategico_finnhub_key\") || \"\";\n    const ghOwner = localStorage.getItem(KEY_G_OWNER) || \"\";\n    const ghRepo = localStorage.getItem(KEY_G_REPO) || \"\";\n    const ghToken = localStorage.getItem(KEY_G_TOKEN) || \"\";\n    const ghConfigured = !!(ghOwner && ghRepo && ghToken);\n    this.setState({\n      lib, assets, positions, theme, finnhubKey,\n      ghOwner, ghRepo, ghToken, ghConfigured, ghLoadOk: false, ghSha: null,\n      ghStatus: ghConfigured ? \"Conectando con GitHub…\" : \"\"\n    });\n    requestAnimationFrame(() => this.setState({ chartIn: true }));\n    if (ghConfigured) this.loadFromGithub();\n    this.refresh();\n    this.timer = setInterval(() => this.refresh(), 120000);\n    this.tickTimer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    document.addEventListener(\"click\", this.ripple, true);\n    this.observer = new IntersectionObserver(entries => {\n      entries.forEach(en => { if (en.isIntersecting) { en.target.setAttribute(\"data-in\", \"1\"); this.observer.unobserve(en.target); } });\n    }, { threshold: 0.15 });\n    this.scan();\n  }\n  scan() {\n    if (!this.observer) return;\n    document.querySelectorAll('[data-reveal]:not([data-in])').forEach(el => this.observer.observe(el));\n  }\n  componentDidUpdate() {\n    requestAnimationFrame(() => this.scan());\n    this.syncTotals();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    clearInterval(this.tickTimer);\n    if (this.observer) this.observer.disconnect();\n    document.removeEventListener(\"click\", this.ripple, true);\n  }\n\n  ripple = (e) => {\n    const host = e.target && e.target.closest && e.target.closest('[data-ripple=\"1\"]');\n    if (!host) return;\n    const r = host.getBoundingClientRect();\n    const size = Math.max(r.width, r.height);\n    const span = document.createElement(\"span\");\n    span.className = \"rip\";\n    span.style.width = span.style.height = size + \"px\";\n    span.style.left = (e.clientX - r.left - size / 2) + \"px\";\n    span.style.top = (e.clientY - r.top - size / 2) + \"px\";\n    host.appendChild(span);\n    setTimeout(() => span.remove(), 620);\n  };\n\n  save(assets, positions) {\n    try {\n      if (assets) localStorage.setItem(KEY_A, JSON.stringify(assets));\n      if (positions) localStorage.setItem(KEY_P, JSON.stringify(positions));\n    } catch (e) {}\n  }\n\n  /* ---------- sincronización con GitHub (repo privado de datos) ---------- */\n  openSync = () => this.setState({\n    modal: \"sync\", modalError: \"\", saveState: \"idle\", syncTestStatus: \"\", syncTestOk: false,\n    form: { gh_owner: this.state.ghOwner || \"\", gh_repo: this.state.ghRepo || \"\", gh_token: this.state.ghToken || \"\" }\n  });\n\n  testGithubConnection = async () => {\n    const owner = (this.state.form.gh_owner || \"\").trim();\n    const repo = (this.state.form.gh_repo || \"\").trim();\n    const token = (this.state.form.gh_token || \"\").trim();\n    if (!owner || !repo || !token) { this.setState({ syncTestStatus: \"Rellena usuario, repo y token.\", syncTestOk: false }); return; }\n    this.setState({ syncTestStatus: \"Probando…\" });\n    try {\n      const res = await fetch(\"https://api.github.com/repos/\" + encodeURIComponent(owner) + \"/\" + encodeURIComponent(repo), {\n        headers: { \"Authorization\": \"Bearer \" + token, \"Accept\": \"application/vnd.github+json\" }\n      });\n      if (res.ok) {\n        this.setState({ syncTestStatus: \"✓ Conexión correcta con \" + owner + \"/\" + repo + \".\", syncTestOk: true });\n      } else if (res.status === 404) {\n        this.setState({ syncTestStatus: \"No se encuentra ese repo (revisa usuario/repo, o si el token tiene acceso).\", syncTestOk: false });\n      } else if (res.status === 401) {\n        this.setState({ syncTestStatus: \"Token inválido o caducado.\", syncTestOk: false });\n      } else if (res.status === 403) {\n        this.setState({ syncTestStatus: \"El token no tiene permiso sobre este repo.\", syncTestOk: false });\n      } else {\n        this.setState({ syncTestStatus: \"Error de conexión (código \" + res.status + \").\", syncTestOk: false });\n      }\n    } catch (e) {\n      this.setState({ syncTestStatus: \"Sin conexión de red.\", syncTestOk: false });\n    }\n  };\n\n  doSaveSync = () => {\n    const owner = (this.state.form.gh_owner || \"\").trim();\n    const repo = (this.state.form.gh_repo || \"\").trim();\n    const token = (this.state.form.gh_token || \"\").trim();\n    if (!owner || !repo || !token) { this.setState({ saveState: \"idle\", modalError: \"Rellena usuario, repo y token.\" }); return; }\n    if (!this.state.syncTestOk) { this.setState({ saveState: \"idle\", modalError: \"Prueba la conexión antes de guardar.\" }); return; }\n    try {\n      localStorage.setItem(KEY_G_OWNER, owner);\n      localStorage.setItem(KEY_G_REPO, repo);\n      localStorage.setItem(KEY_G_TOKEN, token);\n    } catch (e) {}\n    this.setState({\n      ghOwner: owner, ghRepo: repo, ghToken: token, ghConfigured: true, ghSha: null, ghLoadOk: false,\n      ghStatus: \"Conectando con GitHub…\"\n    }, () => { this.finishSave(); this.loadFromGithub(); });\n  };\n\n  loadFromGithub = async () => {\n    if (!this.state.ghOwner || !this.state.ghRepo || !this.state.ghToken) return;\n    this.setState({ ghStatus: \"Cargando datos de GitHub…\" });\n    try {\n      const res = await fetch(\n        \"https://api.github.com/repos/\" + encodeURIComponent(this.state.ghOwner) + \"/\" + encodeURIComponent(this.state.ghRepo) + \"/contents/\" + GH_PATH,\n        { headers: { \"Authorization\": \"Bearer \" + this.state.ghToken, \"Accept\": \"application/vnd.github+json\" } }\n      );\n      if (res.status === 404) {\n        this.setState({ ghLoadOk: true, ghSha: null, ghStatus: \"Sin datos remotos todavía: se creará \" + GH_PATH + \" al guardar.\" });\n        return;\n      }\n      if (!res.ok) {\n        this.setState({ ghLoadOk: false, ghStatus: \"No se pudo cargar desde GitHub (código
